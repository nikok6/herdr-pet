[package]
name = "herdr-pet"
version = "0.2.0"
edition = "2021"
license = "MIT"
description = "Codex-style animated pet floating over herdr agent panes"

[[bin]]
name = "herdr-pet"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["webp", "png"] }
image-webp = "0.2"
color_quant = "1.1"
png = "0.17"
signal-hook = "0.3"
toml = "0.8"
crossterm = "0.29"
libc = "0.2"
base64 = "0.22"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"

[profile.release]
lto = true
strip = true
opt-level = 3
codegen-units = 1
