id = "pet"
name = "Herdr Pet"
version = "0.2.0"
min_herdr_version = "0.9.2"
description = "Codex-style animated pet floating over your agent panes, reacting to agent status"
platforms = ["macos", "linux"]

# Needs a host terminal that speaks the kitty graphics protocol (Ghostty, kitty,
# WezTerm); herdr ≥ 0.9.2 renders pane images natively (on by default).
# Draws by writing Kitty graphics to the pane's pty; see "How it draws" in the README.

# Fetch the prebuilt herdr-pet binary for this platform into
# ./target/release/herdr-pet — everything below invokes that binary.
# (Dev installs via `herdr plugin link` build with `cargo build --release`.)
[[build]]
command = ["bash", "scripts/install.sh"]

[[startup]]
command = ["./target/release/herdr-pet", "ensure"]

[[actions]]
id = "toggle"
title = "Pet: toggle"
description = "Wake the pet or tuck it away"
contexts = ["workspace"]
command = ["./target/release/herdr-pet", "toggle"]

[[actions]]
id = "settings"
title = "Pet: settings"
description = "Open the pet settings popover (pet, size, speed, mode, …)"
contexts = ["workspace"]
command = ["./target/release/herdr-pet", "open-settings"]

# The settings popover itself; opened by the `settings` action via
# `herdr plugin pane open --plugin pet --entrypoint settings`.
[[panes]]
id = "settings"
title = "Pet settings"
placement = "popup"
width = 64
height = 16
command = ["./target/release/herdr-pet", "settings"]
